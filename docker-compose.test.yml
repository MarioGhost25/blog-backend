name: proyectou-audit-test
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: blog_test
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U audit -d blog_test']
      interval: 2s
      timeout: 3s
      retries: 30
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:11025:1025'
      - '127.0.0.1:18025:8025'
